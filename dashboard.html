<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hóa Chuyên Online</title>
<link rel="stylesheet" href="css/style.css" />
<script>
  window.MathJax = {
    tex: { inlineMath: [["\\(", "\\)"], ["$", "$"]], displayMath: [["\\[", "\\]"], ["$$", "$$"]] },
    options: { skipHtmlTags: ["script","noscript","style","textarea","pre","code"] }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Mở danh sách chương">☰</button>
      <a href="dashboard.html" class="brand" id="brand">Trang chủ</a>
    </div>
    <div class="user-box">
      <span id="user-name"></span>
      <button class="logout" onclick="logout()">Đăng xuất</button>
    </div>
  </header>

  <div class="app-shell">
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content-area" id="content-area">
      <div class="loading">Đang tải...</div>
    </main>
  </div>

  <div class="modal-overlay" id="report-overlay">
    <div class="modal-box">
      <h3>Báo lỗi nội dung</h3>
      <p class="modal-sub" id="report-topic-name"></p>
      <label for="report-text">Em thấy lỗi gì? (sai kiến thức, lỗi chính tả, công thức hiển thị sai...)</label>
      <textarea id="report-text" rows="5" placeholder="Mô tả ngắn gọn lỗi em thấy..."></textarea>
      <div class="modal-msg" id="report-msg"></div>
      <div class="modal-actions">
        <button class="btn-secondary" id="report-cancel">Hủy</button>
        <button class="btn-primary" id="report-submit" style="margin-top:0; width:auto; padding:10px 20px;">Gửi báo lỗi</button>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/no-print.js"></script>
  <script src="js/track.js"></script>
  <script src="js/app.js"></script>
  <script>
    const session = requireLogin();
    if (session) {
      document.getElementById("user-name").textContent = "Xin chào, " + session.name;
    }
    document.getElementById("brand").textContent = SITE_NAME;
    document.title = SITE_NAME;
    initApp();
    initTracking();
  </script>
</body>
</html>
